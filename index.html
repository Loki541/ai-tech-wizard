<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tech Wizard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <h1>AI Tech Wizard</h1>
  <p>Interaktywny diagnostyk problemów komputerowych</p>
</header>

<main class="container">
  <div id="chat" class="chat"></div>

  <div class="input-bar">
    <input id="userInput" placeholder="Napisz odpowiedź..." autocomplete="off">
    <button id="send">Wyślij</button>
  </div>
</main>

<footer class="footer">
  <small>AI Tech Wizard — Interaktywny Diagnosta</small>
</footer>

<script src="app.js"></script>
</body>
</html>
