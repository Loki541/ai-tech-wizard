<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>AI Tech Wizard v1.3b</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg:#050b16;
  --panel:#0b1629;
  --accent:#1f8ef1;
  --text:#e7f0ff;
  --muted:#8aa4c4;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:radial-gradient(circle at top,#08142c,#030814);
  font-family:Inter,system-ui,Arial,sans-serif;
  color:var(--text);
}

header {
  padding:32px;
  text-align:center;
}

header h1 {
  margin:0;
  font-size:2rem;
}

header p {
  color:var(--muted);
}

main {
  max-width:900px;
  margin:0 auto;
  padding:16px;
}

#chat {
  background:var(--panel);
  border-radius:14px;
  padding:16px;
  min-height:420px;
  max-height:600px;
  overflow-y:auto;
}

.msg {
  margin-bottom:14px;
  line-height:1.45;
}

.user { color:#9fd1ff; text-align:right; }
.ai   { color:#e7f0ff; text-align:left; }

#inputBar {
  display:flex;
  gap:10px;
  margin-top:14px;
}

textarea {
  flex:1;
  background:#071427;
  color:var(--text);
  border:none;
  border-radius:10px;
  padding:12px;
  resize:none;
  height:70px;
  font-size:16px;
}

button {
  background:var(--accent);
  border:none;
  border-radius:10px;
  padding:0 18px;
  cursor:pointer;
  color:#031d3a;
  font-weight:600;
}
</style>
</head>

<body>

<header>
  <h1>AI Tech Wizard</h1>
  <p>Zaawansowany system diagnostyki sprzętu i oprogramowania</p>
</header>

<main>
  <div id="chat"></div>

  <div id="inputBar">
    <textarea id="input" placeholder="Opisz problem. AI nigdy nie zamyka rozmowy."></textarea>
    <button onclick="send()">Wyślij</button>
  </div>
</main>

<script>
/* =========================
   MEMORY & STATE
========================= */
const memory = {
  history: [],
  hypotheses: [],
  failedSteps: 0,
  currentStep: 0
};

/* =========================
   TYPING ENGINE (FAST, STABLE)
========================= */
let typingInProgress = false;
const chat = document.getElementById("chat");

function typeText(el, text, speed=5) {
  el.textContent = "";
  let i = 0;
  typingInProgress = true;
  const interval = setInterval(() => {
    el.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      typingInProgress = false;
      chat.scrollTop = chat.scrollHeight;
    }
  }, speed);
}

/* =========================
   CHAT HELPERS
========================= */
function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  if(cls==="ai") typeText(div, text);
  else div.textContent = text;
}

/* =========================
   DIAGNOSIS ENGINE
========================= */
const predefinedHypotheses = [
  { title:"GPU / sterowniki", steps:[
    {step:"Zaktualizuj sterowniki GPU.", result:"PENDING"},
    {step:"Sprawdź temperaturę GPU pod obciążeniem.", result:"PENDING"},
    {step:"Uruchom benchmark dla stabilności.", result:"PENDING"}
  ]},
  { title:"CPU / thermal", steps:[
    {step:"Sprawdź temperaturę CPU.", result:"PENDING"},
    {step:"Upewnij się, że wentylatory działają prawidłowo.", result:"PENDING"},
    {step:"Rozważ zmianę pasty termicznej.", result:"PENDING"}
  ]},
  { title:"RAM / pamięć", steps:[
    {step:"Uruchom MemTest86.", result:"PENDING"},
    {step:"Sprawdź, czy wszystkie kości RAM są poprawnie włożone.", result:"PENDING"},
    {step:"Zamień sloty, jeśli problem występuje dalej.", result:"PENDING"}
  ]},
  { title:"System / software", steps:[
    {step:"Sprawdź procesy w tle.", result:"PENDING"},
    {step:"Zaktualizuj system operacyjny.", result:"PENDING"},
    {step:"Uruchom czysty boot systemu.", result:"PENDING"}
  ]}
];

/* =========================
   USER INPUT PARSER
========================= */
function analyzeInput(text) {
  const positive = ["działa","ok","stabilny","temperatura w normie","brak problemu"];
  const negative = ["nie działa","crash","wysokie temperatury","przycięcia","lagi"];

  const t = text.toLowerCase();
  if(positive.some(w=>t.includes(w))) return "POSITIVE";
  if(negative.some(w=>t.includes(w))) return "NEGATIVE";
  return "UNKNOWN";
}

/* =========================
   AI LOGIC
========================= */
function generateNextStep(userText) {
  const status = analyzeInput(userText);
  if(memory.hypotheses.length===0){
    memory.hypotheses.push(JSON.parse(JSON.stringify(predefinedHypotheses[0])));
  }

  const currentHypothesis = memory.hypotheses[0];

  if(status==="POSITIVE") {
    currentHypothesis.steps[memory.currentStep-1].result="OK";
    memory.currentStep++;
  } else if(status==="NEGATIVE") {
    currentHypothesis.steps[memory.currentStep-1].result="FAIL";
    memory.failedSteps++;
    memory.currentStep++;
  } else {
    return "Nie jestem pewny efektów, podaj więcej szczegółów lub wyniki testu.";
  }

  if(memory.currentStep >= currentHypothesis.steps.length){
    if(memory.failedSteps>=2){
      // przechodzimy do nowej hipotezy
      const nextIndex = memory.hypotheses.length<predefinedHypotheses.length ? memory.hypotheses.length : 0;
      memory.hypotheses.push(JSON.parse(JSON.stringify(predefinedHypotheses[nextIndex])));
      memory.currentStep=0;
      memory.failedSteps=0;
      return `Dotychczasowe kroki nie rozwiązały problemu. Przechodzimy do kolejnej hipotezy: ${predefinedHypotheses[nextIndex].title}`;
    } else {
      memory.currentStep=0;
      memory.failedSteps=0;
      return "Wykonaj kolejne testy w ramach tej hipotezy i napisz dokładne obserwacje.";
    }
  }

  return `Hipoteza: ${currentHypothesis.title}\nKrok ${memory.currentStep+1}: ${currentHypothesis.steps[memory.currentStep].step}`;
}

/* =========================
   SEND HANDLER
========================= */
const inputEl = document.getElementById("input");

function send(){
  const text = inputEl.value.trim();
  if(!text || typingInProgress) return;

  addMessage(text,"user");
  memory.history.push(text);
  inputEl.value="";

  const response = generateNextStep(text);
  addMessage(response,"ai");
}

/* =========================
   READY MESSAGE
========================= */
addMessage("Witaj w AI Tech Wizard. Opisz problem z komputerem lub grami. AI nigdy nie zamyka rozmowy i generuje kolejne kroki diagnostyczne.", "ai");

/* =========================
   🔌 OPENAI / WEB HOOK READY
========================= */
/*
Tutaj w przyszłości możesz podpiąć OpenAI API lub backend,
przesyłając memory.history i otrzymując dynamiczne odpowiedzi.
*/
</script>

</body>
</html>
